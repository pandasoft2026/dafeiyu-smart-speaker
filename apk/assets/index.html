<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>大肥鱼</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; outline:none !important; }
  button { border:0; outline:none; background:none; font:inherit; color:inherit; }
  button:focus, button:active, button:focus-visible { outline:none; box-shadow:none; }
  html,body { width:100%; height:100%; overflow:hidden; }
  body {
    font-family:"Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif;
    background:#EAF5FF; color:#123A5A; user-select:none;
    display:flex; align-items:center; justify-content:center;
  }
  #stage {
    position:relative; width:1280px; height:800px; flex:0 0 auto;
    transform-origin:center center;
    /* 背景只用「单半径 circle」径向渐变 + 一层线性渐变。
       曾经用 radial-gradient(1100px 620px at ...) 这种双长度椭圆写法，
       这台设备的老 WebView 解析异常，会在右下角糊出一个硬边白圆（用户
       一直当成残影的那个圈），而且多层径向渐变每帧都要重算，纯属浪费。 */
    background:
      radial-gradient(circle 520px at 86% 104%, rgba(210,233,255,.9), rgba(210,233,255,0) 100%),
      linear-gradient(158deg, #E9F5FF 0%, #F8FCFF 46%, #E1F0FD 100%);
    overflow:hidden;
  }
  /* 三层 blur(62px) 的大圆在 4×A35 上是很重的图层，而且这台设备的 WebView
     对 blur 支持不完整（边缘会硬化），所以整组去掉，柔光改由 #stage 背景提供 */
  .blob { display:none !important; }
  .b1 { width:430px; height:430px; left:-130px; top:-150px; background:#BEE3FF; }
  .b2 { width:390px; height:390px; right:-100px; bottom:-130px; background:#CFEFFF; }
  .b3 { width:300px; height:300px; left:46%; top:2%; background:#EAF8FF; }

  .app { position:relative; width:1280px; height:800px; display:flex; flex-direction:column; }

  /* 顶栏：上层品牌状态行 + 下层行情条 */
  .top {
    height:132px; flex:0 0 132px; display:flex; flex-direction:column;
    padding:8px 32px 6px;
  }
  .top-row { display:flex; align-items:center; gap:13px; height:52px; flex:0 0 52px; }

  /* 行情条：2 行 × 6 列，字号不小于状态 chip 的 18px */
  .market-bar {
    flex:1 1 auto; display:grid; grid-template-columns:repeat(6, 1fr);
    grid-template-rows:repeat(2, 1fr); column-gap:6px; row-gap:1px;
    align-items:center;
  }
  .mkt {
    display:flex; align-items:baseline; gap:6px; white-space:nowrap;
    font-size:18px; font-weight:800; color:#335F7E; line-height:1.15;
  }
  .mkt .n { color:#7298B5; font-size:18px; }
  .mkt .p { color:#123F61; font-variant-numeric:tabular-nums; }
  .mkt .c { font-size:18px; font-variant-numeric:tabular-nums; }
  .mkt .up { color:#D8403B; }     /* 涨=红（A股习惯） */
  .mkt .down { color:#159A6A; }   /* 跌=绿 */
  .mkt .flat { color:#8FAABE; }
  .mkt.weather .n { color:#C08030; }
  .mkt.weather .p { color:#A06020; }
  .logo { width:44px; height:44px; border-radius:14px; flex:0 0 44px; object-fit:cover; box-shadow:0 6px 16px rgba(46,155,240,.26); }
  .brand { font-size:26px; font-weight:900; letter-spacing:.5px; color:#0F3355; line-height:1.1; white-space:nowrap; }
  .sub { font-size:15px; color:#7C9FBA; font-weight:700; margin-left:6px; white-space:nowrap; }
  .spacer { flex:1; }
  .chip {
    display:flex; align-items:center; gap:8px; white-space:nowrap;
    background:rgba(255,255,255,.8); border:1px solid rgba(46,155,240,.22);
    padding:7px 15px; border-radius:18px; font-size:18px; font-weight:800; color:#2E7FB8;
    box-shadow:0 4px 14px rgba(46,155,240,.10);
  }
  .dot { width:9px; height:9px; border-radius:50%; background:#37C08B; box-shadow:0 0 0 4px rgba(55,192,139,.16); }
  .dot.off { background:#F0903C; box-shadow:0 0 0 4px rgba(240,144,60,.16); }
  .clock { font-size:21px; font-weight:900; color:#2E7FB8; margin-left:16px; font-variant-numeric:tabular-nums; }

  /* 主体 */
  .main { flex:1 1 auto; display:flex; min-height:0; padding:0 32px 0; gap:14px; }

  .hero { flex:0 0 500px; width:500px; position:relative; display:flex; align-items:center; justify-content:center; overflow:visible; }
  .hero .halo {
    position:absolute; bottom:56px; width:340px; height:56px; border-radius:50%;
    background:radial-gradient(closest-side, rgba(46,155,240,.22), rgba(46,155,240,0)); filter:blur(5px);
  }
  .hero img {
    position:relative; max-height:572px; max-width:496px; width:auto; height:auto; display:block;
    /* 常驻浮动动画在 4×A35 上实测吃掉 0.6 个核（WebView 占用 66% -> 6%），
       所以只在「正在听」时才动；阴影由 .halo 提供，不再用昂贵的 drop-shadow */
    transform-origin:50% 92%;
  }
  @keyframes float { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-11px) rotate(-.7deg)} }
  .hero.listening img {
    animation:float 1.5s ease-in-out infinite;
    will-change:transform; backface-visibility:hidden;
  }
  .hero.listening .halo { background:radial-gradient(closest-side, rgba(255,138,178,.42), rgba(255,138,178,0)); }

  /* 对话 */
  .chatwrap { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; padding-bottom:6px; }
  .chat { flex:1 1 auto; overflow-y:auto; padding:6px 6px 8px 2px; display:flex; flex-direction:column; gap:14px; }
  .chat::-webkit-scrollbar { display:none; }

  /* 用量面板：麦克风这一排的横长条，所有信息一次显示完，不收起。 */
  .usage {
    position:absolute; right:14px; top:50%; transform:translateY(-50%); width:238px;
    z-index:12; font-family:inherit; user-select:none; -webkit-user-select:none;
  }
  .usage .ubody {
    display:flex; flex-direction:column; align-items:flex-start; gap:3px;
    width:100%; box-sizing:border-box; padding:7px 11px; white-space:nowrap;
    border-radius:12px; background:rgba(255,255,255,.88);
    border:1px solid rgba(46,155,240,.18); box-shadow:0 3px 10px rgba(46,155,240,.10);
    font-size:13px; font-weight:800; color:#365F7D;
  }
  .usage .line { display:flex; align-items:center; gap:7px; }
  .usage .item { display:flex; align-items:baseline; gap:3px; }
  .usage .k { color:#8FB4CE; font-size:12px; }
  .usage .v { color:#1F567E; font-variant-numeric:tabular-nums; }
  .usage .v.star { color:#D08A2A; }
  .usage .udot { width:6px; height:6px; border-radius:50%; background:#57C98A; flex:0 0 6px; }
  .usage .udot.off { background:#D6A44A; }
  .usage .refresh {
    cursor:pointer; color:#2E8FE8; font-size:12px; font-weight:800;
    padding:1px 5px; border-radius:6px; background:rgba(46,155,240,.08);
  }

  .row { display:flex; gap:11px; align-items:flex-start; flex:0 0 auto; min-height:0;
        animation:pop .28s cubic-bezier(.2,1.2,.4,1); }
  @keyframes pop { from{opacity:0; transform:translateY(10px) scale(.97)} to{opacity:1; transform:none} }
  .row.me { flex-direction:row-reverse; }
  .av { width:42px; height:42px; border-radius:14px; flex:0 0 42px; object-fit:cover; box-shadow:0 4px 12px rgba(46,155,240,.18); }
  .bubble {
    max-width:calc(100% - 58px); padding:16px 22px; border-radius:20px; font-size:26px; line-height:1.48;
    font-weight:700; word-break:break-word; white-space:pre-wrap;
  }
  .row.ai .bubble {
    background:#fff; color:#153E60; border:1px solid rgba(46,155,240,.16);
    border-top-left-radius:7px; box-shadow:0 10px 24px rgba(46,155,240,.11);
  }
  .row.me .bubble {
    background:linear-gradient(135deg,#3EA9F7,#2E8FE8); color:#fff;
    border-top-right-radius:7px; box-shadow:0 10px 24px rgba(46,143,232,.26);
  }
  .typing { display:inline-flex; gap:7px; padding:4px 0; }
  .typing i { width:10px; height:10px; border-radius:50%; background:#8CC6F0; animation:blink 1.3s infinite; }
  .typing i:nth-child(2){animation-delay:.18s} .typing i:nth-child(3){animation-delay:.36s}
  @keyframes blink { 0%,60%,100%{opacity:.25; transform:translateY(0)} 30%{opacity:1; transform:translateY(-4px)} }

  /* 系统分隔条 */
  .sys { flex:0 0 auto; display:flex; align-items:center; gap:14px; font-size:16px; font-weight:800; color:#8FB4CE; letter-spacing:2px; padding:2px 8px; }
  .sys::before, .sys::after { content:""; flex:1; height:1px; background:linear-gradient(90deg,rgba(46,155,240,0),rgba(46,155,240,.34),rgba(46,155,240,0)); }

  /* 底栏 */
  .bottom { height:146px; flex:0 0 146px; display:flex; align-items:center; justify-content:center; position:relative; }
  .mic {
    width:104px; height:104px; border-radius:50%; border:none; cursor:pointer; position:relative;
    background:linear-gradient(145deg,#4CB4FF,#2E8FE8);
    box-shadow:0 14px 30px rgba(46,143,232,.36), inset 0 2px 0 rgba(255,255,255,.45);
    display:flex; align-items:center; justify-content:center; transition:transform .14s;
    margin-right:22px;
  }
  .mic:active { transform:scale(.94); }
  .mic:focus { outline:none; }
  .mic:focus:not(:active) { box-shadow:0 14px 30px rgba(46,143,232,.36), inset 0 2px 0 rgba(255,255,255,.45); }
  .mic svg { width:46px; height:46px; fill:#fff; }
  .mic.busy { background:linear-gradient(145deg,#FFA8C6,#F4708F); box-shadow:0 14px 30px rgba(244,112,143,.36); }
  .ring { position:absolute; inset:-10px; border-radius:50%; border:3px solid rgba(255,168,198,.7); opacity:0; }
  .mic.busy .ring { animation:pulse 1.5s ease-out infinite; }
  @keyframes pulse { 0%{transform:scale(.92); opacity:.9} 100%{transform:scale(1.35); opacity:0} }
  .hint { font-size:20px; color:#5E88A6; font-weight:800; }
  .hint b { color:#2E8FE8; }
  .status {
    position:absolute; left:50%; transform:translateX(-50%); bottom:6px;
    font-size:17px; color:#6E93B0; font-weight:800; height:22px; white-space:nowrap;
  }
  .wave { display:inline-flex; gap:3px; align-items:flex-end; height:16px; margin-right:8px; vertical-align:-2px; }
  .wave span { width:4px; background:#F4708F; border-radius:2px; animation:w .9s ease-in-out infinite; }
  .wave span:nth-child(1){height:6px} .wave span:nth-child(2){height:14px; animation-delay:.1s}
  .wave span:nth-child(3){height:9px; animation-delay:.2s} .wave span:nth-child(4){height:16px; animation-delay:.3s}
  .wave span:nth-child(5){height:7px; animation-delay:.4s}
  @keyframes w { 0%,100%{transform:scaleY(.5)} 50%{transform:scaleY(1)} }

  /* 名字铭牌（仅梁圣模式） */
  .plate { display:none; position:absolute; left:26px; bottom:12px; text-align:left; }
  .plate .pbar { width:56px; height:3px; border-radius:2px; background:linear-gradient(90deg,#D8B26A,rgba(216,178,106,0)); margin-bottom:16px; }
  .plate .pn { font-size:54px; font-weight:900; color:#F3F7FB; letter-spacing:12px; line-height:1; text-shadow:0 6px 22px rgba(0,0,0,.75); }
  .plate .pe { font-size:12px; font-weight:800; color:#C8A96A; letter-spacing:6px; margin-top:12px; text-shadow:0 3px 12px rgba(0,0,0,.7); }

  /* ================= 梁圣模式 ================= */
  #stage.sage {
    background:#060C15 url("sage_bg.jpg") center center no-repeat;
    background-size:cover;
  }
  .sage .blob { display:none; }
  .sage .hero { flex:0 0 592px; width:592px; }
  .sage .hero img, .sage .hero .halo { display:none; }
  .sage .plate { display:block; }
  .sage .brand { color:#F4F8FC; text-shadow:0 3px 14px rgba(0,0,0,.6); }
  .sage .sub { color:#C8A96A; letter-spacing:1px; }
  .sage .logo { border-radius:50%; box-shadow:0 0 0 1px rgba(216,178,106,.55), 0 8px 20px rgba(0,0,0,.55); }
  .sage .chip { background:rgba(9,18,30,.62); border-color:rgba(216,178,106,.30); color:#E7D6AC; box-shadow:none; }
  .sage .clock { color:#E6EEF7; text-shadow:0 3px 14px rgba(0,0,0,.6); }
  .sage .row.ai .bubble {
    background:rgba(250,252,255,.95); color:#0B1B2B;
    border:1px solid rgba(255,255,255,.55); box-shadow:0 14px 30px rgba(0,0,0,.45);
  }
  .sage .row.me .bubble {
    background:linear-gradient(135deg,rgba(52,96,136,.92),rgba(24,46,68,.92)); color:#EAF3FB;
    border:1px solid rgba(140,190,235,.26); box-shadow:0 14px 30px rgba(0,0,0,.42);
  }
  .sage .row.me .av { display:none; }
  .sage .row.ai .av { border-radius:50%; box-shadow:0 0 0 1px rgba(216,178,106,.5), 0 6px 16px rgba(0,0,0,.55); }
  .sage .av { box-shadow:0 6px 16px rgba(0,0,0,.55); }
  .sage .typing i { background:#9DBBD6; }
  .sage .sys { color:#C8A96A; }
  .sage .sys::before, .sage .sys::after { background:linear-gradient(90deg,rgba(216,178,106,0),rgba(216,178,106,.42),rgba(216,178,106,0)); }
  .sage .mic {
    background:linear-gradient(145deg,#31506E,#132538);
    box-shadow:0 14px 32px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.16);
  }
  .sage .mic svg { fill:#DCBE7C; }
  .sage .mic:focus:not(:active) { box-shadow:0 14px 32px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.16); }
  .sage .mic.busy { background:linear-gradient(145deg,#8A6A33,#543E19); box-shadow:0 14px 32px rgba(0,0,0,.6); }
  .sage .ring { border-color:rgba(216,178,106,.75); }
  .sage .hint { color:#A8BDD2; text-shadow:0 2px 10px rgba(0,0,0,.55); }
  .sage .hint b { color:#E2C58C; }
  .sage .status { color:#95AAC0; text-shadow:0 2px 10px rgba(0,0,0,.6); }
  .sage .wave span { background:#D8B26A; }

  /* 音量条（本机无 SystemUI，自绘） */
  .vol {
    position:absolute; left:50%; bottom:150px; z-index:20; pointer-events:none;
    display:flex; align-items:center; gap:13px; padding:11px 22px; border-radius:999px;
    background:rgba(7,15,25,.86); border:1px solid rgba(255,255,255,.16);
    box-shadow:0 18px 44px rgba(0,0,0,.45);
    opacity:0; transform:translate(-50%,10px);
    transition:opacity .2s ease, transform .2s ease;
  }
  .vol.show { opacity:1; transform:translate(-50%,0); }
  .vol .vico { width:24px; height:24px; fill:#EAF3FB; flex:0 0 24px; }
  .vol .vbar { width:230px; height:9px; border-radius:5px; background:rgba(255,255,255,.20); overflow:hidden; }
  .vol .vbar i { display:block; height:100%; width:20%; border-radius:5px; background:linear-gradient(90deg,#4CB4FF,#8FD6FF); transition:width .12s ease; }
  .vol .vnum { font-size:19px; font-weight:900; color:#EAF3FB; min-width:58px; text-align:right; font-variant-numeric:tabular-nums; }
  .sage .vol { background:rgba(6,11,19,.88); border-color:rgba(216,178,106,.30); }
  .sage .vol .vico { fill:#DCBE7C; }
  .sage .vol .vbar i { background:linear-gradient(90deg,#B98F3E,#EBD49B); }
  .vol.mute .vbar i { background:#8A97A6 !important; }

  /* 启动遮罩 */
  .splash {
    position:absolute; inset:0; z-index:9; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:20px;
    background:linear-gradient(160deg,#EAF6FF,#F8FCFF 58%,#E3F2FD);
    transition:opacity .55s;
  }
  .splash img { width:180px; height:180px; border-radius:42px; box-shadow:0 22px 48px rgba(46,155,240,.26); }
  .splash .n { font-size:38px; font-weight:900; color:#0F3355; letter-spacing:2px; }
  .splash .s { font-size:19px; color:#6E93B0; font-weight:800; }
  .splash.hide { opacity:0; pointer-events:none; }

  /* 关掉一切动效：4×A35 上常驻 animation 等于每帧重绘，界面光效再好看也
     换不来一句回答的速度。布局、配色、圆角全部保留，只是不再动。 */
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
  .hero.listening img { will-change: auto; }
</style>
</head>
<body>
<div id="stage">

  <div class="app">
    <div class="top">
      <div class="top-row">
        <img class="logo" id="logo" src="avatar_192.png" alt="">
        <div class="brand" id="brand">大肥鱼</div>
        <div class="sub" id="sub">本地离线语音</div>
        <div class="spacer"></div>
        <div class="mkt weather" id="weatherChip"><span class="n">绵阳</span><span class="p" id="wTxt">—</span></div>
        <div class="chip"><span class="dot" id="dot"></span><span id="netTxt">就绪</span></div>
        <div class="clock" id="clock">--:--</div>
      </div>
      <div class="market-bar" id="marketBar"></div>
    </div>

    <div class="main">
      <div class="hero" id="hero">
        <div class="halo"></div>
        <img id="charImg" src="char_620.png" alt="大肥鱼">
        <div class="plate">
          <div class="pbar"></div>
          <div class="pn">梁圣</div>
          <div class="pe">LIANG SHENG</div>
        </div>
      </div>
      <div class="chatwrap">
        <div class="chat" id="chat"></div>
      </div>
    </div>

    <div class="bottom">
      <button class="mic" id="mic" aria-label="说话">
        <span class="ring"></span>
        <svg viewBox="0 0 24 24"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-5a3.5 3.5 0 1 0-7 0v5A3.5 3.5 0 0 0 12 15zm6-3.5a6 6 0 0 1-5 5.92V20h3v2H8v-2h3v-2.58a6 6 0 0 1-5-5.92h2a4 4 0 0 0 8 0h2z"/></svg>
      </button>
      <div class="hint" id="hint">点一下 <b>麦克风</b>，我就在听啦</div>
      <div class="status" id="status"></div>
      <div class="usage" id="usageBox">
        <div class="ubody" id="usageBody">
          <div class="line">
            <span class="udot" id="usageDot"></span>
            <div class="item"><span class="k">模型</span><span class="v" id="uModel">—</span></div>
            <div class="item"><span class="k">★</span><span class="v star" id="uStars">—</span></div>
          </div>
          <div class="line">
            <div class="item"><span class="k">tokens</span><span class="v" id="uTotal">—</span></div>
            <div class="item"><span class="k">入/出</span><span class="v" id="uSplit">—</span></div>
            <div class="item"><span class="k">次数</span><span class="v" id="uCalls">—</span></div>
          </div>
          <div class="line">
            <div class="item"><span class="k">余额</span><span class="v" id="uBalance">—</span></div>
            <span class="refresh" id="uRefresh" title="刷新">↻</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="vol" id="vol">
    <svg class="vico" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4.2V4.8L8 9H4zm11.6 3a4.6 4.6 0 0 0-2.1-3.83v7.66A4.6 4.6 0 0 0 15.6 12zm-2.1-7.4v2.06a6.8 6.8 0 0 1 0 10.68v2.06a8.8 8.8 0 0 0 0-14.8z"/></svg>
    <div class="vbar"><i id="vfill"></i></div>
    <div class="vnum" id="vnum">20%</div>
  </div>

  <div class="splash" id="splash">
    <img id="splashImg" src="avatar_192.png" alt="">
    <div class="n" id="splashName">大肥鱼</div>
    <div class="s" id="bootTxt">正在唤醒小鲸鱼…</div>
  </div>
</div>

<script>
console.log('UI v4 build 1120-u');
var API = 'http://127.0.0.1:8899';
var TTS = 'http://127.0.0.1:8899/api/tts';            // 音箱本地合成，不依赖电脑
var TTS_FALLBACK = 'http://${PC_IP:-192.168.1.2}:8900/tts';   // 本地挂了才用电脑兜底
var DESIGN_W = 1280, DESIGN_H = 800;

/* 两套人设：语音、头像、文案 */
var P = {
  fish: {
    name: '大肥鱼', title: '大肥鱼', sub: '本地离线语音', av: 'avatar_192.png',
    voice: 'zh-CN-XiaoyiNeural', pitch: 28, rate: 4,
    hint: '点一下 <b>麦克风</b>，我就在听啦',
    hello: '你好呀，我是大肥鱼～点下面的麦克风，跟我说句话吧！',
    back: '大肥鱼回来啦～想我了吗？'
  },
  sage: {
    name: '梁圣', title: '梁圣', sub: 'DEEPSEEK · 本源', av: 'avatar_sage.png',
    voice: 'zh-CN-YunyangNeural', pitch: -10, rate: -6,
    hint: '点一下 <b>麦克风</b>，说重点',
    hello: '梁圣已上线。有事直说。',
    back: '梁圣已上线。有事直说。'
  }
};

var mode = 'fish';
var busy = false;
var busyT0 = 0;
var currentAudio = null;
var speakSeq = 0;      // 每次播报递增，用来让上一轮的调度器失效
var wakeWant = true;
var wakeSent = null;
var wakeGuard = null;
var toastTimer = null;
var chatHist = [];   // 不能叫 history：window.history 只读，会被静默忽略

var chat = document.getElementById('chat');
var mic = document.getElementById('mic');
var hero = document.getElementById('hero');
var statusEl = document.getElementById('status');
var dot = document.getElementById('dot');
var netTxt = document.getElementById('netTxt');
var stage = document.getElementById('stage');

/* ---------- 视口自适应 ---------- */
function fit(){
  var s = Math.min(window.innerWidth / DESIGN_W, window.innerHeight / DESIGN_H);
  stage.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit); fit();

/* ---------- 工具 ---------- */
function scrollDown(){ chat.scrollTop = chat.scrollHeight; }

function setStatus(html){
  if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
  statusEl.innerHTML = html || '';
}

function toast(text, ms){
  statusEl.textContent = text || '';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ statusEl.textContent = ''; toastTimer = null; }, ms || 2400);
}

function addSys(text){
  var d = document.createElement('div');
  d.className = 'sys';
  d.textContent = text;
  chat.appendChild(d); scrollDown();
}

/* 消息区不是无底洞：这东西要在家常开，一天几十轮对话，DOM 节点和 chatHist
   只增不减的话，跑上一周就是一个卡顿的页面。只留最近 40 条。 */
var MAX_ROWS = 40;
function trimChat(){
  while (chat.children.length > MAX_ROWS) chat.removeChild(chat.children[0]);
  if (chatHist.length > MAX_ROWS) chatHist = chatHist.slice(-MAX_ROWS);
}

function addRow(side, text){
  var row = document.createElement('div');
  row.className = 'row ' + side;
  row.innerHTML = '<img class="av" src="' + P[mode].av + '"><div class="bubble"></div>';
  row.querySelector('.bubble').textContent = text;
  chat.appendChild(row); scrollDown();
  trimChat();
  return row.querySelector('.bubble');
}

function addTyping(){
  var row = document.createElement('div');
  row.className = 'row ai';
  row.innerHTML = '<img class="av" src="' + P[mode].av + '"><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>';
  chat.appendChild(row); scrollDown();
  return row;
}

/* 原来是一字一字蹦出来的打字机效果（每 32ms 一个 setTimeout，60 字的回答要
   二十来次回调 + 二十来次重排 + 二十来次 scrollDown）。语音早就念完了，
   屏幕上还在蹦字，纯属拖累；而且截屏时经常拍到半截浅色的字。
   直接一次性贴上去，函数名保留，调用点不用改。 */
function typeOut(el, text, done){
  el.textContent = text;
  scrollDown();
  if (done) done();
}

/* ---------- 语音播放 ---------- */
/* 唤醒开关：只在状态真的变了才发请求，发失败的下一轮 poll 会自动补发，
   否则一次丢包就会让唤醒永远关着，表现就是「喊它没反应」 */
function setWake(active){
  wakeWant = !!active;
  pushWake();
}

function pushWake(){
  if (wakeSent === wakeWant) return;
  var want = wakeWant;
  wakeSent = want;
  try {
    fetch(API + '/api/wake', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({active: want})
    }).then(function(r){ return r.json(); }).catch(function(){ wakeSent = null; });
  } catch(e){ wakeSent = null; }
}

function stopSpeak(){
  speakSeq += 1;                 // 让上一轮还在排队的句子全部作废
  if (currentAudio) { try { currentAudio.pause(); } catch(e){} currentAudio = null; }
  if (wakeGuard) { clearTimeout(wakeGuard); wakeGuard = null; }
  setWake(true);
}

function ttsUrl(base, text){
  var p = P[mode];
  return base + '?text=' + encodeURIComponent(text) +
         '&voice=' + p.voice + '&pitch=' + p.pitch + '&rate=' + p.rate;
}

/* 按句切分：整段一次性合成要等两三秒才出声，长回复更久。
   切成句子并行合成、按顺序播，第一句先响起来，后面几秒正好用来合成。
   只按句末标点切，单句太长才退一步按逗号切，尽量保住语调连贯。 */
function splitSpeech(text){
  var HARD = '。！？；!?;\n', SOFT = '，、,';
  var MAX = 40, out = [], buf = '';
  for (var i = 0; i < text.length; i++){
    buf += text.charAt(i);
    var hard = HARD.indexOf(text.charAt(i)) >= 0;
    if (hard){
      if (buf.trim()) out.push(buf.trim());
      buf = '';
    } else if (buf.length >= MAX){
      var cut = -1;
      for (var k = 0; k < SOFT.length; k++){
        cut = Math.max(cut, buf.lastIndexOf(SOFT.charAt(k)));
      }
      if (cut > MAX * 0.4){
        if (buf.slice(0, cut + 1).trim()) out.push(buf.slice(0, cut + 1).trim());
        buf = buf.slice(cut + 1);
      } else {
        if (buf.trim()) out.push(buf.trim());
        buf = '';
      }
    }
  }
  if (buf.trim()) out.push(buf.trim());
  // 「嗯。」「好的。」这种太短的句子单独合成不值当，也不自然，并到相邻那段
  var merged = [];
  for (var j = 0; j < out.length; j++){
    if (merged.length && (out[j].length < 8 || merged[merged.length - 1].length < 8)){
      merged[merged.length - 1] += out[j];
    } else {
      merged.push(out[j]);
    }
  }
  out = merged;
  // 段数别太多，否则一口气并发十几个请求反而拖慢第一句
  if (out.length > 8){
    out = out.slice(0, 7).concat([out.slice(7).join('')]);
  }
  return out.length ? out : [text];
}

// 底层：把若干片段排片并顺序播完（已验证的播放逻辑，原 speak 原封不动）
function playSegments(segs, seq){
  text = (segs || []).join('');
  if (!text.trim()) return;
  var base = TTS;
  var players = [];
  var i = 0;

  var finish = function(){
    if (seq !== speakSeq) return;
    currentAudio = null;
    if (wakeGuard) { clearTimeout(wakeGuard); wakeGuard = null; }
    setWake(true);
  };

  var armGuard = function(ms){
    if (wakeGuard) clearTimeout(wakeGuard);
    wakeGuard = setTimeout(function(){
      if (seq !== speakSeq) return;
      speakSeq += 1;
      currentAudio = null;
      if (wakeGuard) { clearTimeout(wakeGuard); wakeGuard = null; }
      console.warn('tts 超时，强制恢复唤醒');
      setWake(true);
    }, ms);
  };

  var timers = [];
  var build = function(){
    var t;
    for (t = 0; t < timers.length; t++) clearTimeout(timers[t]);
    timers = [];
    players = [];
    for (var k = 0; k < segs.length; k++){
      var el = new Audio();
      el.preload = 'auto';
      players.push(el);
      if (k === 0){
        el.src = ttsUrl(base, segs[k]);
      } else {
        (function(el2, st, delay){
          timers.push(setTimeout(function(){ el2.src = ttsUrl(base, st); }, delay));
        })(el, segs[k], 350 * k);
      }
    }
  };

  var step = function(k){
    if (seq !== speakSeq) return;
    if (k >= players.length) { finish(); return; }
    var el = players[k];
    currentAudio = el;
    armGuard(14000);
    var adv = false;
    el.onplaying = function(){
      var d = el.duration;
      if (isFinite(d) && d > 0) armGuard(d * 1000 + 5000);
    };
    el.onended = function(){
      if (adv) return;
      adv = true;
      step(k + 1);
    };
    el.onerror = function(){
      if (seq !== speakSeq || adv) return;
      adv = true;
      if (base === TTS && TTS_FALLBACK){
        console.warn('tts 本地失败，改用电脑兜底');
        base = TTS_FALLBACK;
        build();
        step(0);
      } else {
        console.warn('tts 这句失败，跳过');
        step(k + 1);
      }
    };
    el.play().catch(function(e){
      console.warn('play blocked', e);
      if (adv) return;
      adv = true;
      step(k + 1);
    });
  };

  build();
  setWake(false);
  step(0);
}

// 一次性播完整段（点按麦克风、问候语、人设切换等老路径）
function speak(text){
  stopSpeak();
  text = (text || '').trim();
  if (!text) return;
  playSegments(splitSpeech(text), speakSeq);
}

/* ---------- 流式播报：第一句先播，后续句子静默排队 ----------
   DeepSeek 逐句推过来。设计要点：
   1) 不能每句都调 speak() —— 那会 stopSpeak() 把上一句掐掉。
   2) 已经开播的这一批不打断；新句子进来只追加到待播队列。
   3) 待播队列在前一批播放期间就开始合成（设 src 即触发预取），
      这样前一句刚停，下一句立刻就能出声。 */
var speakStream = null;

function streamBegin(q){
  stopSpeak();
  speakStream = { q: q || '', seq: speakSeq, parts: [], played: 0,
                  running: false, finished: false };
}

function streamPush(sentence, idx){
  var ss = speakStream;
  if (!ss || ss.finished || ss.seq !== speakSeq) return;
  sentence = (sentence || '').trim();
  if (!sentence) return;
  ss.parts[idx] = sentence;
  // 只入队，不在这里起播/打断。统一的 watcher 负责取下一批。
  ss.pump();
}

function streamEnd(){
  var ss = speakStream;
  if (!ss) return;
  ss.finished = true;
  ss.pump();
}

// 给队列对象装上 pump：唯一一个循环，播完才取下一批，绝不中途打断。
function streamBegin(q){
  stopSpeak();
  var ss = { q: q || '', seq: speakSeq, parts: [], played: 0,
             running: false, finished: false, watcher: null };

  ss.pump = function(){
    var self = this;
    if (this.seq !== speakSeq) return;
    if (this.running) return;                  // 正在播，新句子只入队

    var rest = [];
    for (var k = this.played; k < this.parts.length; k++){
      if (this.parts[k]) rest = rest.concat(splitSpeech(this.parts[k]));
    }
    if (!rest.length){
      if (this.finished) speakStream = null;   // 全播完，释放
      return;
    }
    this.played = this.parts.length;
    this.running = true;
    playSegments(rest, this.seq);

    if (!this.watcher){
      this.watcher = setInterval(function(){
        if (self.seq !== speakSeq){ clearInterval(self.watcher); return; }
        if (currentAudio !== null) return;     // 还在播，等下一轮
        clearInterval(self.watcher);
        self.watcher = null;
        self.running = false;
        self.pump();                           // 播完了，取下一批
      }, 250);
    }
  };

  speakStream = ss;
}

/* ---------- 主题切换 ---------- */
function applyMode(m, announce){
  if (!P[m]) return;
  var changed = (m !== mode);
  mode = m;
  var p = P[m];
  stage.className = (m === 'sage') ? 'sage' : '';
  document.title = p.title;
  document.getElementById('logo').src = p.av;
  document.getElementById('splashImg').src = p.av;
  document.getElementById('splashName').textContent = p.name;
  document.getElementById('brand').textContent = p.name;
  document.getElementById('sub').textContent = p.sub;
  document.getElementById('hint').innerHTML = p.hint;
  var avs = document.querySelectorAll('.av');
  for (var i = 0; i < avs.length; i++) avs[i].src = p.av;

  if (changed && announce) {
    stopSpeak();
    chat.innerHTML = '';
    chatHist = [];
    addSys(m === 'sage' ? '梁圣 已上线' : '大肥鱼 已上线');
    var hi = (m === 'sage') ? p.hello : p.back;
    addRow('ai', hi);
    setTimeout(function(){ speak(hi); }, 260);
  }
}

/* ---------- 对话 ---------- */
/* 所有请求带超时：宁可报错重来，也不能把 busy 卡死 */
function racer(p, ms, tag){
  return new Promise(function(res, rej){
    var done = false;
    var t = setTimeout(function(){
      if (!done) { done = true; rej(new Error(tag + '超时')); }
    }, ms);
    p.then(function(v){ if (!done) { done = true; clearTimeout(t); res(v); } },
           function(e){ if (!done) { done = true; clearTimeout(t); rej(e); } });
  });
}

function api(path, body, ms){
  return racer(fetch(API + path, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body || {})
  }).then(function(r){ return r.json(); }), ms, path);
}

function idle(){
  busy = false;
  busyT0 = 0;
  mic.classList.remove('busy');
  hero.classList.remove('listening');
}

/* 进忙碌态：所有入口都走这里，保证 busyT0 一定被设上 */
function startBusy(){
  busy = true;
  busyT0 = Date.now();
  stopSpeak();
  mic.classList.add('busy');
}

/* 一轮对话的结果统一从这里落地：服务端推送和按钮请求共用 */
var pending = null;      /* 正在等待回答的「…」气泡 */
var lastQ = '';          /* 已经显示过的问题，避免重复上屏 */

function onHeard(ev){
  if (!ev || !ev.q) return;
  console.log('[dfy] heard ' + ev.q);
  if (!ev.streaming) stopSpeak();
  addRow('me', ev.q);
  chatHist.push({role:'user', content: ev.q});
  lastQ = ev.q;
  setStatus('让我想想…');
  if (pending) pending.remove();
  pending = addTyping();
}

/* 流式逐句：第一句立刻开播，后续句子排队，文字也逐句贴出来 */
function onPartial(ev){
  if (!ev || !ev.text) return;
  if (!speakStream || speakStream.q !== ev.q) {
    streamBegin(ev.q);
    if (pending) { pending.remove(); pending = null; }
    if (lastQ !== ev.q) {
      addRow('me', ev.q);
      chatHist.push({role:'user', content: ev.q});
      lastQ = ev.q;
    }
    if (!window.__streamAiRow) window.__streamAiRow = addRow('ai', '');
  }
  setStatus('');
  if (window.__streamAiRow) {
    var cur = window.__streamAiRow.textContent || '';
    window.__streamAiRow.textContent = cur + ev.text;
  }
  streamPush(ev.text, ev.idx || 0);
}

function showTurn(ev){
  console.log('[dfy] turn q=' + (ev.q || '').slice(0, 12) + ' lastQ=' + (lastQ || '').slice(0, 12) + ' ans=' + (ev.answer || '').length);
  if (pending) { pending.remove(); pending = null; }
  idle();
  if (ev.mode && ev.mode !== mode) applyMode(ev.mode, false);
  if (!ev.q) {
    setStatus(ev.err ? '没听到声音，再来一次吧' : '没听清呢，再说一次嘛～');
    setTimeout(function(){ setStatus(''); }, 2400);
    return;
  }
  if (!ev.streamed) stopSpeak();   // 流式路径的队列还在播，不能打断
  if (ev.q !== lastQ) {
    addRow('me', ev.q);
    chatHist.push({role:'user', content: ev.q});
  }
  lastQ = '';
  var ans = ev.answer || '嗯…我没想好';
  chatHist.push({role:'assistant', content: ans});
  var b = addRow('ai', '');
  if (ev.streamed) {
    // 流式路径：句子已经逐句播了，这里只负责收尾
    window.__streamAiRow = null;
    streamEnd();
    typeOut(b, ans, function(){ setStatus(''); });
  } else {
    speak(ans);
    typeOut(b, ans, function(){ setStatus(''); });
  }
  refreshUsage(false);   // 对话结束刷新一次用量/余额
}

/* 麦克风按钮：一次请求完成录音 + 识别 + 回答 */
function micTurn(){
  if (busy) return;
  startBusy();
  hero.classList.add('listening');
  setStatus('<span class="wave"><span></span><span></span><span></span><span></span><span></span></span>在听啦，说完会自动停…');
  api('/api/turn', {seconds: 6}, 55000).then(function(j){
    if (j.err === 'busy') {
      idle();
      toast('还在忙上一句，等一下～');
      return;
    }
    if (j.type === 'mode') {
      onMode(j);
      return;
    }
    // 流式路径：partial 事件已经把句子播上了，这里只补聊天记录。
    // 老路径（非流式）仍走 showTurn 完整播报。
    if (j.streamed && speakStream) {
      if (pending) { pending.remove(); pending = null; }
      if (!window.__streamAiRow) window.__streamAiRow = addRow('ai', '');
      window.__streamAiRow.textContent = j.answer || '';
      chatHist.push({role:'assistant', content: j.answer || ''});
      window.__streamAiRow = null;
      streamEnd();
      setStatus('');
      refreshUsage(false);   // 对话结束刷新一次用量/余额
    } else {
      showTurn(j);
    }
  }).catch(function(e){
    idle();
    setStatus('出了点问题：' + e.message);
    setTimeout(function(){ setStatus(''); }, 3200);
  });
}

mic.addEventListener('click', micTurn);
document.addEventListener('touchstart', function(){ try { if (AC && AC.state === 'suspended') AC.resume(); } catch(e){} }, true);
document.addEventListener('click', function(){ try { if (AC && AC.state === 'suspended') AC.resume(); } catch(e){} }, true);

/* ---------- 唤醒事件 ---------- */
/* 唤起时先「叮」一声：不响一下，用户根本不知道该什么时候开口 */
var AC = null;
function ding(){
  try {
    if (!AC) {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) { console.log('[dfy] no AudioContext'); return; }
      AC = new C();
    }
    if (AC.state === 'suspended') AC.resume();
    var t = AC.currentTime;
    for (var i = 0; i < 2; i++) {
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine';
      o.frequency.value = (i === 0) ? 880 : 1320;
      var t0 = t + i * 0.085;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.09, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.075);
      o.connect(g); g.connect(AC.destination);
      o.start(t0); o.stop(t0 + 0.09);
    }
    console.log('[dfy] ding');
  } catch (e) { console.log('[dfy] ding err ' + e.message); }
}

/* 唤醒之后服务端会自己把这句话录完，前端只负责把「在听」亮起来 */
function onWake(ev){
  if (busy) return;
  startBusy();
  ding();
  hero.classList.add('listening');
  setStatus('<span class="wave"><span></span><span></span><span></span><span></span><span></span></span>在听啦…');
}

/* 切人设：先复位忙态，否则「召唤梁圣」之后界面会一直转着 */
function onMode(ev){
  idle();
  if (pending) { pending.remove(); pending = null; }
  lastQ = '';
  setStatus('');
  if (ev.mode && ev.mode !== mode) applyMode(ev.mode, true);
}

/* ---------- 轮询服务端事件（长轮询：没事件就挂住等，省电） ---------- */
function poll(){
  var t0 = Date.now(), got = 0;
  fetch(API + '/api/events?wait=20', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){
    if (j.mode && j.mode !== mode) applyMode(j.mode, true);
    var evs = j.events || [];
    got = evs.length;
    for (var i = 0; i < evs.length; i++) {
      var ev = evs[i];
      console.log('[dfy] ev=' + ev.type + ' q=' + (ev.q || '').slice(0, 12) + ' busy=' + busy);
      try {
        if (ev.type === 'wake') { onWake(ev); }
        else if (ev.type === 'heard') { onHeard(ev); }
        else if (ev.type === 'partial') { onPartial(ev); }
        else if (ev.type === 'turn') { showTurn(ev); }
        else if (ev.type === 'toast') { toast(ev.text); }
        else if (ev.type === 'mode') { onMode(ev); }
      } catch (e) {
        console.log('[dfy] EVT ERR ' + ev.type + ' ' + e.message);
        idle();
        setStatus('界面出错：' + e.message);
        setTimeout(function(){ setStatus(''); }, 4000);
      }
    }
  }).catch(function(){
    dot.className = 'dot off'; netTxt.textContent = '服务未启动';
  }).then(function(){
    // 上一轮结束再排下一轮，避免请求慢时越堆越多。
    // 服务端支持长轮询时这一轮会挂 20s；如果不支持（秒回且没事件），
    // 就退化成 600ms 一次，绝不能空转。
    pushWake();
    var dt = Date.now() - t0;
    setTimeout(poll, (got || dt > 300) ? 0 : 600);
  });
}

/* ---------- 音量条（原生按键触发） ---------- */
var volEl = document.getElementById('vol');
var vfill = document.getElementById('vfill');
var vnum = document.getElementById('vnum');
var volTimer = null;

window.onVolume = function(cur, max, muted){
  var pct = (max > 0) ? Math.round(cur * 100 / max) : 0;
  vfill.style.width = pct + '%';
  vnum.textContent = muted ? '静音' : (pct + '%');
  if (muted) volEl.classList.add('mute'); else volEl.classList.remove('mute');
  volEl.classList.add('show');
  if (volTimer) clearTimeout(volTimer);
  volTimer = setTimeout(function(){ volEl.classList.remove('show'); }, 1500);
};

/* ---------- 时钟 / 健康 ---------- */
var _lastClock = '';
function tick(){
  var d = new Date();
  var v = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  if (v === _lastClock) return;   // 同一分钟不重排重绘
  _lastClock = v;
  document.getElementById('clock').textContent = v;
}
setInterval(tick, 1000); tick();

function health(){
  return fetch(API + '/health', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){
    dot.className = 'dot'; netTxt.textContent = '在线';
    if (j.mode && j.mode !== mode) applyMode(j.mode, true);
    return true;
  }).catch(function(){
    dot.className = 'dot off'; netTxt.textContent = '服务未启动';
    return false;
  });
}

/* ---------- 启动 ---------- */
/* 兜底看门狗：任何原因让 busy 卡住，60 秒后强制复位，绝不允许界面假死 */
setInterval(function(){
  if (busy && busyT0 && Date.now() - busyT0 > 60000) {
    idle();
    setStatus('刚才卡了一下，再说一次吧');
    setTimeout(function(){ setStatus(''); }, 2600);
  }
}, 1000);

window.onerror = function(msg, src, line){
  console.log('[dfy] ONERROR ' + msg + ' @' + line);
  setStatus('脚本出错：' + msg);
  setTimeout(function(){ setStatus(''); }, 4000);
};

window.addEventListener('unhandledrejection', function(e){
  var r = e && e.reason;
  console.log('[dfy] REJECT ' + (r && r.message ? r.message : r));
});

/* ---------- 底栏用量横条 ----------
   常驻显示，不收起。刷新时机：每次对话结束后调一次 refreshUsage()；
   余额在服务端有 5 分钟缓存，所以对话结束刷新也不会打爆接口。 */
function fmtNum(n){
  n = Number(n) || 0;
  return n >= 10000 ? (n/10000).toFixed(1) + '万' : String(n);
}
function refreshUsage(force){
  return fetch(API + '/api/stats' + (force ? '?force=1' : ''), {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(j){
      var u = j.usage || {}, b = j.balance || {};
      document.getElementById('uModel').textContent = j.model || '—';
      document.getElementById('uTotal').textContent = fmtNum(u.total);
      document.getElementById('uSplit').textContent =
        fmtNum(u.prompt) + ' / ' + fmtNum(u.completion);
      document.getElementById('uCalls').textContent = u.calls || 0;
      var bal = b.value;
      document.getElementById('uBalance').textContent =
        (bal === null || bal === undefined)
          ? (b.err ? '不可用' : '查询中…')
          : (bal + ' ' + (b.currency || 'CNY'));
      var gh = j.github || {}, st = gh.stars || {};
      document.getElementById('uStars').textContent =
        (st.count === null || st.count === undefined) ? '—' : st.count;
      var dot = document.getElementById('usageDot');
      if (dot) dot.className = 'udot' + (b.err ? ' off' : '');
    }).catch(function(){
      document.getElementById('uBalance').textContent = '离线';
    });
}
(function(){
  var rf = document.getElementById('uRefresh');
  if (rf) rf.addEventListener('click', function(){ refreshUsage(true); });
})();

/* ---------- 顶栏行情/天气条 ----------
   10 秒刷新一次；服务端对行情缓存 30s、天气 10min，所以不会打爆接口。
   节点只建一次，后续只改文本 —— 这台 4×A35 上反复重建 DOM 会卡。 */
var mktNodes = [];
var mktTimer = null;
function fmtPx(v){
  if (v === null || v === undefined) return '—';
  return (Math.round(v * 100) / 100).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtPct(v){
  if (v === null || v === undefined) return '';
  return (v >= 0 ? '+' : '') + (Math.round(v * 100) / 100).toFixed(2) + '%';
}
function mktClass(v){ return v === null || v === undefined ? 'flat' : (v > 0 ? 'up' : (v < 0 ? 'down' : 'flat')); }
function makeMktNode(isWeather){
  var d = document.createElement('div');
  d.className = 'mkt' + (isWeather ? ' weather' : '');
  var n = document.createElement('span'); n.className = 'n';
  var p = document.createElement('span'); p.className = 'p';
  var c = document.createElement('span'); c.className = 'c';
  d.appendChild(n); d.appendChild(p); d.appendChild(c);
  return {el:d, n:n, p:p, c:c};
}
function renderMarket(d){
  var bar = document.getElementById('marketBar');
  if (!bar || !d) return;
  var list = d.market || [];
  // 行情条固定 12 格（2行×6列）；天气单独放在顶行
  var total = list.length;
  while (mktNodes.length < total) {
    var nd = makeMktNode(false);
    mktNodes.push(nd); bar.appendChild(nd.el);
  }
  for (var i = 0; i < list.length; i++) {
    var it = list[i], nd = mktNodes[i];
    nd.n.textContent = it.name;
    nd.p.textContent = fmtPx(it.price);
    nd.c.textContent = fmtPct(it.pct);
    nd.c.className = 'c ' + mktClass(it.pct);
  }
  var w = d.weather || {}, wt = document.getElementById('wTxt');
  if (wt) wt.textContent = w.temp === null || w.temp === undefined ? '—' : (Math.round(w.temp) + '° ' + (w.desc || ''));
}
function refreshMarket(){
  return fetch(API + '/api/dashboard', {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(d){ renderMarket(d); })
    .catch(function(){ /* 取不到就保留上次的值，不显示假数据 */ });
}

(function boot(){
  // 预载梁圣背景，避免切换时白闪
  try { var pi = new Image(); pi.src = 'sage_bg.jpg'; } catch(e){}

  health().then(function(ok){
    document.getElementById('bootTxt').textContent = ok ? '我准备好啦' : '语音服务未启动';
    setTimeout(function(){
      document.getElementById('splash').classList.add('hide');
      if (chat.children.length === 0) {
        addRow('ai', P[mode].hello);
        speak(P[mode].hello);
      }
    }, ok ? 800 : 2200);
    setTimeout(function(){ poll(); }, 1200);
    setInterval(health, 8000);
    // 用量横条：启动时拉一次；之后每次对话结束刷新一次（见 showTurn / micTurn）
    refreshUsage(false);
    // 顶栏行情：启动拉一次，之后每 10 秒
    refreshMarket();
    mktTimer = setInterval(refreshMarket, 10000);
  });
})();
</script>
